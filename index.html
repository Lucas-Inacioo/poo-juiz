<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juiz POO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/comment-fold.min.js"></script>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5b6474; --line: #dfe3ea; --accent: #1f7a4d; --bad: #b3261e; --code: #f1f3f6; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font: 15px/1.6 system-ui, sans-serif; color: var(--text); background: var(--bg); }
  aside { width: 42%; min-width: 320px; overflow-y: auto; padding: 24px 28px; background: var(--panel); border-right: 1px solid var(--line); }
  aside img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs a { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 13px; }
  .tabs a.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; overflow-x: auto; margin: 6px 0 14px; }
  li { margin-bottom: 6px; }
  .bar { display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .bar .file { font-family: monospace; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  .bar .file.on { border-color: var(--line); background: var(--code); font-weight: 600; }
  .bar .file .x { margin-left: 6px; color: var(--muted); }
  .bar .file .x:hover { color: var(--bad); }
  .bar .add { font-size: 13px; padding: 2px 10px; }
  .bar .right { margin-left: auto; display: flex; gap: 12px; align-items: center; white-space: nowrap; font-size: 12px; color: var(--muted); }
  .status::before { content: "●"; margin-right: 4px; color: #c69200; }
  .status.ok::before { color: var(--accent); }
  .status.bad::before { color: var(--bad); }
  .CodeMirror { flex: 1; height: auto; font-size: 14px; border-bottom: 1px solid var(--line); }
  .CodeMirror-foldmarker { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); text-shadow: none; font-family: monospace; }
  .bottom { height: 38%; display: flex; flex-direction: column; background: var(--panel); }
  .actions { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .actions .spacer { flex: 1; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.on { background: var(--code); font-weight: 600; }
  button:disabled { opacity: .6; cursor: wait; }
  .io { flex: 1; display: flex; min-height: 0; }
  .io > div { flex: 1; display: flex; flex-direction: column; padding: 8px 12px; min-width: 0; }
  .io > div + div { border-left: 1px solid var(--line); }
  .io label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  textarea, .out { flex: 1; font: 13px/1.5 monospace; border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: none; margin-top: 4px; background: var(--code); color: var(--text); overflow: auto; white-space: pre; }
  .out details { white-space: normal; margin: 2px 0; }
  .out summary { cursor: pointer; white-space: pre; }
  .out .cols { display: flex; gap: 8px; margin: 4px 0 8px 18px; }
  .out .cols div { flex: 1; min-width: 0; white-space: pre-wrap; overflow-x: auto; }
  .out .cols b { display: block; font-family: system-ui, sans-serif; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .out .cols button { font-size: 11px; padding: 0 6px; margin-left: 6px; }
  .pass { color: var(--accent); font-weight: 700; }
  .fail { color: var(--bad); font-weight: 700; }
  .diff { background: #fbe3e1; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
  #zoom img { max-width: 96vw; max-height: 96vh; background: #fff; }
  @media (max-width: 800px) {
    body { flex-direction: column; height: auto; }
    aside { width: 100%; min-width: 0; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    main { height: 100vh; }
  }
</style>
</head>
<body>
<aside>
  <nav class="tabs" id="tabs"></nav>
  <div id="statement">Carregando...</div>
  <footer>Java no navegador com <a href="https://cheerpj.com">CheerpJ</a>. Código do juiz em <a href="https://github.com/Lucas-Inacioo/poo-juiz">github.com/Lucas-Inacioo/poo-juiz</a>.</footer>
</aside>

<main>
  <div class="bar">
    <span id="files"></span><button class="add" id="add" title="Criar arquivo">+ arquivo</button>
    <span class="right"><span id="saved"></span><span class="status" id="status">carregando o Java...</span></span>
  </div>
  <textarea id="code"></textarea>
  <div class="bottom">
    <div class="actions">
      <button id="run" class="go">Executar com a entrada</button>
      <button id="submit" class="go primary">Enviar</button>
      <span class="spacer"></span>
      <button id="fold" title="Ctrl+Q dobra ou abre o bloco do cursor">Recolher métodos</button>
      <button id="download" title="Baixa o arquivo aberto">Baixar arquivo</button>
      <button id="reset">Restaurar arquivos-base</button>
    </div>
    <div class="io">
      <div><label for="input">Entrada</label><textarea id="input" spellcheck="false"></textarea></div>
      <div><label>Resultado</label><div class="out" id="out">Ctrl+Enter executa e Ctrl+Shift+Enter envia. O Java roda no seu navegador e o código fica salvo nele. Na primeira visita o Java demora um pouco para carregar.</div></div>
    </div>
  </div>
</main>
<div id="zoom"><img alt=""></div>
<div id="console" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
